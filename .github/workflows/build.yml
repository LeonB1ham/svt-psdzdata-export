name: Build Windows exe

on:
  release:
    types: [published]
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow tkinterdnd2

      - name: Demo export (CLI smoke test)
        run: python app.py --svt demo\sample-svt-ist.xml --soll demo\sample-svt.xml --psdz demo --out demo\out --missing-report demo\out\missing.txt

      - name: Larger screen for screenshots
        shell: powershell
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Screenshots (English UI)
        continue-on-error: true
        shell: powershell
        run: |
          # Run from a short, readable path so the screenshots don't show the CI folder
          New-Item -ItemType Directory -Force C:\SVT-PSdZData-Export | Out-Null
          Copy-Item *.py C:\SVT-PSdZData-Export\
          Copy-Item demo C:\SVT-PSdZData-Export\demo -Recurse -Force
          Remove-Item C:\SVT-PSdZData-Export\demo\out -Recurse -Force -ErrorAction SilentlyContinue
          Push-Location C:\SVT-PSdZData-Export
          python demo\capture_screens.py
          Pop-Location
          Copy-Item C:\SVT-PSdZData-Export\demo\screenshots\*.png demo\screenshots\ -Force

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: demo/screenshots/*.png

      - name: Commit screenshots to the release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/screenshots/*.png
          git diff --cached --quiet || (git commit -m "Update English screenshots [skip ci]" && git push)

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name SVT-PSdZData-Export
          --hidden-import engine --hidden-import i18n --hidden-import version --hidden-import mega
          --collect-all tkinterdnd2
          app.py

      - name: Check exe CLI
        run: .\dist\SVT-PSdZData-Export.exe --tal demo\sample-tal.xml --psdz demo --out demo\out-exe

      - uses: actions/upload-artifact@v4
        with:
          name: SVT-PSdZData-Export
          path: dist/SVT-PSdZData-Export.exe

      - name: Attach exe to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/SVT-PSdZData-Export.exe --clobber

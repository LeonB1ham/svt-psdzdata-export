name: Build Windows exe

on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow tkinterdnd2

      - name: Demo export (CLI smoke test)
        run: python app.py --svt demo\sample-svt-ist.xml --soll demo\sample-svt.xml --psdz demo --out demo\out --missing-report demo\out\missing.txt

      - name: Larger screen for screenshots
        shell: powershell
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Screenshots (English UI)
        continue-on-error: true
        run: python demo\capture_screens.py

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: demo/screenshots/*.png

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name SVT-PSdZData-Export
          --hidden-import engine --hidden-import i18n --hidden-import version
          --collect-all tkinterdnd2
          app.py

      - name: Check exe CLI
        run: .\dist\SVT-PSdZData-Export.exe --tal demo\sample-tal.xml --psdz demo --out demo\out-exe

      - uses: actions/upload-artifact@v4
        with:
          name: SVT-PSdZData-Export
          path: dist/SVT-PSdZData-Export.exe

      - name: Attach exe to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/SVT-PSdZData-Export.exe --clobber
